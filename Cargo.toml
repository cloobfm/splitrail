[package]
name = "splitrail-dashboard"
version = "2.0.0-dash-0.18"
edition = "2024"
license = "MIT"
authors = ["Piebald LLC <support@piebald.ai>"]

[dependencies]
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0"
anyhow = "1.0"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
rayon = "1.8"
num-format = "0.4"
ratatui = "0.29"
crossterm = "0.29"
toml = "0.9.2"
async-trait = "0.1"
notify = "8.1"
notify-types = "2.0"
sha2 = "0.10"
phf = { version = "0.12.1", features = ["macros"] }
serde_bytes = "0.11.17"
simd-json = { version = "0.15.1", features = ["serde"] }
tiktoken-rs = "0.6"
rusqlite = "0.33"
dirs = "5.0.1"
regex = "1.12.2"
libc = "0.2"

[dependencies.clap]
version = "4.5.41"
features = ["derive"]

[dependencies.reqwest]
version = "0.12.22"
default-features = false
features = ["rustls-tls"]

[dev-dependencies]
tempfile = "3.0"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
# For benchmarking different hash algorithms
ahash = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# For memory profiling
memory-stats = "1.0"

[[bench]]
name = "performance_bench"
harness = false

[[bench]]
name = "performance_regression"
harness = false

[lib]
name = "splitrail_dashboard"
path = "src/lib.rs"

[[bin]]
name = "splitrail-dashboard"
path = "src/main.rs"
